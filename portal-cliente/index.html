<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal del cliente</title><meta name="theme-color" content="#16a34a">
<style>
:root{--p:#16a34a;--p2:#15803d;--pl:#dcfce7;--bg:#f6faf7;--card:#fff;--txt:#0f1f14;--mut:#5b6b60;--line:#e3ece6;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#e9eee9;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt)}
#app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;padding-bottom:96px;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0}
.ib{width:38px;height:38px;border:0;background:transparent;display:grid;place-items:center;position:relative}
.ib svg{width:24px;height:24px}.dot{position:absolute;top:6px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--p);border:2px solid var(--bg)}
.hero{text-align:center;padding:0 20px 8px;background:radial-gradient(420px 220px at 50% 0,var(--pl),transparent)}
.hero img{max-height:104px;max-width:240px;object-fit:contain}
.mono{display:inline-grid;place-items:center;width:74px;height:74px;border-radius:20px;background:var(--p);color:#fff;font-size:30px;font-weight:800}
.hello{padding:6px 20px 2px}.hello h1{font-size:21px}.hello p{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:18px;box-shadow:0 2px 14px rgba(15,31,20,.07);border:1px solid var(--line)}
.estado{margin:14px 16px;padding:16px;display:grid;grid-template-columns:1fr 1px 1fr;gap:12px;align-items:center}
.estado .sep{background:var(--line);height:48px}.estado small{color:var(--mut);font-size:12px;display:block}
.estado b{font-size:17px}.ok{color:var(--p)}.mal{color:var(--bad)}.pend{color:var(--warn)}
.plan{display:flex;gap:12px;align-items:center}.wifi{width:44px;height:44px;border-radius:50%;background:var(--p);display:grid;place-items:center}.wifi svg{width:26px;height:26px;stroke:#fff}
h2{font-size:15px;margin:18px 20px 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px}
.ac{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px 10px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.2;box-shadow:0 2px 10px rgba(15,31,20,.05);color:var(--txt);text-decoration:none;display:block}
.ac svg{display:block;margin:0 auto 6px;width:30px;height:30px;stroke:var(--p)}.ac span{display:block;font-weight:400;color:var(--mut);font-size:10.5px;margin-top:2px}
.banner{margin:16px;border-radius:18px;padding:20px;color:#fff;background:linear-gradient(135deg,#0b3d20,var(--p2));min-height:120px}
.banner b{display:block;font-size:19px;margin-bottom:4px}.banner p{opacity:.9;font-size:13.5px;margin-bottom:12px}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;background:var(--p);color:#fff;text-decoration:none;cursor:pointer}
.btn.w{background:#fff;color:var(--p2)}.btn.full{display:block;width:100%;text-align:center}.btn.wa{background:#25d366;color:#053b1b}.btn.o{background:transparent;color:var(--p2);border:1.5px solid var(--p)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);text-decoration:none;font-weight:600}
.nav a svg{width:23px;height:23px}.nav a.on{color:var(--p)}.nav a.on svg{stroke:var(--p)}
.nav .pay{margin-top:-30px}.nav .pay i{width:58px;height:58px;border-radius:50%;background:var(--p);display:grid;place-items:center;box-shadow:0 6px 16px rgba(22,163,74,.45);border:4px solid var(--bg)}
.nav .pay svg{stroke:#fff;width:26px;height:26px}
.pg{padding:16px}.pg h1{font-size:22px;margin:6px 0 14px}.back{color:var(--p2);font-weight:700;text-decoration:none;display:inline-block;margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;gap:10px}.row+.row{border-top:1px solid var(--line)}
.chip{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px}.c-ok{background:#dcfce7;color:#166534}.c-p{background:#fef3c7;color:#92400e}.c-m{background:#fee2e2;color:#991b1b}
.mut{color:var(--mut);font-size:13px}.big{font-size:30px;font-weight:800}.sp>*+*{margin-top:12px}
.medio{padding:14px 16px}.medio b{display:block}.medio code{background:var(--pl);padding:3px 8px;border-radius:8px;font-size:15px}
.login{padding:30px 22px}.login input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font:inherit;margin:8px 0 12px}
iframe{width:100%;border:0;border-radius:16px;height:300px}
.demo{position:fixed;top:0;left:0;right:0;background:#111;color:#fff;font-size:11px;text-align:center;padding:3px;z-index:20}
.login{padding:34px 22px 20px;text-align:center}.login h1{font-size:22px;margin:14px 0 4px}.login p{color:var(--mut);margin-bottom:16px}.login input{width:100%;padding:15px;border:1px solid var(--line);border-radius:14px;font:inherit;font-size:18px;text-align:center;margin:0 0 12px;background:#fff;letter-spacing:.5px}.login .err{color:var(--bad);font-weight:600;min-height:20px;margin-bottom:8px}.login small{display:block;color:var(--mut);margin-top:14px}.cargando{padding:80px 20px;text-align:center;color:var(--mut)}.inp{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;margin-top:4px}.sp>*+*{margin-top:14px}</style></head><body><div id="app"></div>
<script>
/* ===== Configuración (se completa con la API; estos valores son solo de respaldo) ===== */
var CFG = { nombre:"Mi proveedor de internet", logoUrl:null, color:"#16a34a", whatsapp:"", horario:"", municipio:"", speedtestUrl:"https://fast.com" };
var DEMO_MODE = location.protocol === "file:";   /* la vista de ejemplo solo existe al abrir el archivo en local */
var DEMO = { nombre:"Juan", nombreCompleto:"Juan Pérez", documento:"1.083.000.000", contrato:"123", plan:"Fibra 50 Megas", velocidad:50, estadoServicio:"Activo", direccion:"Calle 10 # 5-20, Ciénaga", saldo:50000,
  facturas:[{p:"Octubre 2026",m:50000,e:"PENDIENTE",v:"05/10/2026",s:50000},{p:"Septiembre 2026",m:50000,e:"PAGADA",v:"05/09/2026",s:0}], medios:[{n:"Nequi",v:"300 000 0000"},{n:"Transferencia",v:"Cuenta 000-000000-00"}], promos:[], wifi:{habilitado:true,ssid:"MiRed"} };
var C = null, TOKEN = null;
try { TOKEN = localStorage.getItem("portal_token"); } catch (e) {}
var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var esc = function(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var money = function(n){return "$"+Number(n).toLocaleString("es-CO")};
var fecha = function(x){var d=new Date(x);return isNaN(d)?"":("0"+d.getUTCDate()).slice(-2)+"/"+("0"+(d.getUTCMonth()+1)).slice(-2)+"/"+d.getUTCFullYear()};
var periodo = function(x){var d=new Date(x);return isNaN(d)?"":MESES[d.getUTCMonth()].replace(/^./,function(c){return c.toUpperCase()})+" "+d.getUTCFullYear()};
var I = {
 menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
 bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21a2 2 0 0 0 4 0"/></svg>',
 wifi:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1" fill="#fff"/></svg>',
 inv:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>',
 card:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>',
 gauge:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 18a9 9 0 1 1 16 0M12 14l4-5"/><circle cx="12" cy="14" r="1.3"/></svg>',
 head:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H4zM17 14h3v5h-3zM17 19c0 1.5-2 2-5 2"/></svg>',
 router:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 16.5h.01M11 16.5h.01M8 13l-2-6M16 13l2-6"/></svg>',
 mega:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v3l12 5V6zM15 9a4 4 0 0 1 0 8M6 14l1 5h3"/></svg>',
 pin:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
 wa:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.6zM9 8.5c0 3.5 3 6.5 6.5 6.5l1.2-1.4-2-1-1 .7a4 4 0 0 1-2-2l.7-1-1-2z"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6"/></svg>',
 usd:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M16.5 7.5C15.5 6 14 5.5 12 5.5c-2.5 0-4 1.2-4 3 0 4.5 8.5 2 8.5 6.500 0 1.800-1.700 3-4.500 3-2 0-3.800-.8-4.500-2.500"/></svg>',
 help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H4zM17 14h3v5h-3z"/></svg>',
 user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>'
};
function tel(n){n=String(n||"").replace(/\D/g,"");return n.length===10?"57"+n:n}
function logo(){return CFG.logoUrl?'<img src="'+esc(CFG.logoUrl)+'" alt="'+esc(CFG.nombre)+'">':'<div class="mono">'+esc(CFG.nombre.split(/\s+/).map(function(x){return x[0]}).join("").slice(0,2).toUpperCase())+'</div><div style="font-weight:800;font-size:20px;margin-top:6px">'+esc(CFG.nombre)+'</div>'}
function wa(txt){return CFG.whatsapp?"https://wa.me/"+tel(CFG.whatsapp)+"?text="+encodeURIComponent(txt):"#soporte"}
function nav(on){var t=[["inicio","Inicio",I.home],["facturas","Facturas",I.doc],["pagar","Pagar",I.usd],["soporte","Soporte",I.help],["perfil","Perfil",I.user]];
 return '<nav class="nav">'+t.map(function(x){return x[0]==="pagar"?'<a class="pay" href="#pagar"><i>'+x[2]+'</i>'+x[1]+'</a>':'<a href="#'+x[0]+'" class="'+(on===x[0]?"on":"")+'">'+x[2]+x[1]+'</a>'}).join("")+'</nav>'}
function ac(h,ic,a,b){return '<a class="ac" href="'+h+'" '+(h.indexOf("http")===0?'target="_blank" rel="noopener"':"")+'>'+ic+a+(b?'<span>'+b+'</span>':'')+'</a>'}
function pg(titulo,cuerpo,on){return '<div class="pg"><a class="back" href="#inicio">‹ Volver</a><h1>'+titulo+'</h1>'+cuerpo+'</div>'+nav(on||"")}
var contrato = function(){return C.contrato?" (contrato "+C.contrato+")":""};

var V = {
 login:function(paso,doc,err){return '<div class="login"><div class="hero" style="background:none">'+logo()+'</div><h1>Ingresa a tu cuenta</h1>'+
  (paso===2?'<p>Te enviamos un código de 6 dígitos a tu WhatsApp registrado.</p><input id="cod" inputmode="numeric" maxlength="6" placeholder="Código de 6 dígitos" autocomplete="one-time-code"><div class="err">'+esc(err||"")+'</div><button class="btn full" id="ver">Entrar</button><small><a href="#login" id="otro" style="color:var(--p2);font-weight:700">Usar otro documento</a></small>'
   :'<p>Escribe tu número de documento y te enviamos un código por WhatsApp.</p><input id="doc" inputmode="numeric" maxlength="20" placeholder="Número de documento" autocomplete="off"><div class="err">'+esc(err||"")+'</div><button class="btn full" id="sol">Enviar código</button><small>Solo para clientes con servicio de internet.</small>')+'</div>'},
 inicio:function(){var d=C.saldo,ok=d<=0;return '<div class="top"><span></span><a class="ib" href="#promos" aria-label="Avisos" style="text-decoration:none;color:inherit">'+I.bell+(C.promos.length?'<i class="dot"></i>':"")+'</a></div><div class="hero">'+logo()+'</div>'+
  '<div class="hello"><h1>¡Hola, '+esc(C.nombre)+'!</h1><p>Bienvenido a '+esc(CFG.nombre)+'</p></div>'+
  '<div class="card estado"><div class="plan"><div class="wifi">'+I.wifi.replace("<svg","<svg stroke=\"#fff\"")+'</div><div><small>Plan actual</small><b>'+esc(C.plan)+'</b><div class="'+(C.estadoServicio==="Activo"?"ok":"mal")+'" style="font-size:13px;font-weight:700">'+esc(C.estadoServicio)+'</div></div></div><div class="sep"></div><div><small>Estado de cuenta</small><b class="'+(ok?"ok":"pend")+'">'+(ok?"Al día ✓":"Saldo "+money(d))+'</b><small>'+(ok?"Facturas al día":"Pendiente de pago")+'</small></div></div>'+
  '<h2>Accesos rápidos</h2><div class="grid">'+ac("#facturas",I.inv,"Mis Facturas")+ac("#pagar",I.card,"Realizar Pago")+ac("#velocidad",I.gauge,"Test de Velocidad")+ac("#soporte",I.head,"Soporte Técnico","Reportar falla")+ac("#plan",I.router,"Mi Plan","Ver detalles")+ac("#promos",I.mega,"Promociones","y noticias")+ac("#cobertura",I.pin,"Cobertura","y zonas")+ac(wa("Hola, soy "+C.nombreCompleto+contrato()+"."),I.wa,"WhatsApp","Escríbenos")+'</div>'+
  '<div class="banner"><b>¡Navega sin límites!</b><p>Con la mejor velocidad y estabilidad.</p><a class="btn w" href="#plan">Conoce tu plan ›</a></div>'+nav("inicio")},
 facturas:function(){var d=C.saldo;return pg("Mis facturas",'<div class="card" style="padding:16px;margin-bottom:14px"><span class="mut">Saldo pendiente</span><div class="big '+(d>0?"pend":"ok")+'">'+money(d)+'</div></div><div class="card">'+(C.facturas.length?C.facturas.map(function(f){var c=f.e==="PAGADA"?"c-ok":f.e==="VENCIDA"?"c-m":"c-p";return '<div class="row"><div><b>'+esc(f.p)+'</b><div class="mut">Vence '+esc(f.v)+'</div></div><div style="text-align:right"><b>'+money(f.m)+'</b><div><span class="chip '+c+'">'+esc(f.e.toLowerCase())+'</span></div></div></div>'}).join(""):'<div class="row mut">Aún no tienes facturas.</div>')+'</div>',"facturas")},
 pagar:function(){var d=C.saldo;return pg("Realizar pago",'<div class="card" style="padding:16px;margin-bottom:14px"><span class="mut">Valor a pagar</span><div class="big">'+money(Math.max(d,0))+'</div></div>'+(C.medios.length?'<div class="card sp">'+C.medios.map(function(m){return '<div class="medio"><b>'+esc(m.n)+'</b><code>'+esc(m.v)+'</code></div>'}).join("")+'</div>':'<div class="card" style="padding:16px"><span class="mut">Escríbenos por WhatsApp para conocer los medios de pago.</span></div>')+'<p class="mut" style="margin:14px 2px">Después de pagar, envía el comprobante para que quede registrado.</p><a class="btn wa full" target="_blank" rel="noopener" href="'+wa("Hola, soy "+C.nombreCompleto+contrato()+". Envío mi comprobante de pago por "+money(Math.max(d,0))+".")+'">Enviar comprobante por WhatsApp</a>',"pagar")},
 soporte:function(){return pg("Soporte técnico",'<div class="card sp" style="padding:16px"><b>¿Sin internet o muy lento?</b><p class="mut">1. Apaga el router 30 segundos y vuelve a encenderlo.<br>2. Revisa que los cables estén bien conectados.<br>3. Si sigue igual, repórtalo.</p><a class="btn full" target="_blank" rel="noopener" href="'+wa("Hola, soy "+C.nombreCompleto+contrato()+(C.direccion?", "+C.direccion:"")+". Quiero reportar una falla en mi servicio de internet.")+'">Reportar una falla</a></div>'+(CFG.horario?'<div class="card" style="padding:16px;margin-top:14px"><b>Horario de atención</b><p class="mut">'+esc(CFG.horario)+'</p></div>':""),"soporte")},
 perfil:function(){return pg("Mi perfil",'<div class="card"><div class="row"><span class="mut">Nombre</span><b>'+esc(C.nombreCompleto)+'</b></div><div class="row"><span class="mut">Documento</span><b>'+esc(C.documento)+'</b></div>'+(C.contrato?'<div class="row"><span class="mut">Contrato</span><b>'+esc(C.contrato)+'</b></div>':"")+'<div class="row"><span class="mut">Dirección</span><b style="text-align:right">'+esc(C.direccion)+'</b></div></div><p style="margin-top:16px"><a class="btn o full" href="#salir">Cerrar sesión</a></p>',"perfil")},
 plan:function(){return pg("Mi plan",'<div class="card"><div class="row"><span class="mut">Plan</span><b>'+esc(C.plan)+'</b></div>'+(C.velocidad?'<div class="row"><span class="mut">Velocidad</span><b>'+C.velocidad+' Mbps'+(C.subida&&C.subida===C.velocidad?" simétricos":"")+'</b></div>':"")+'<div class="row"><span class="mut">Estado</span><b class="'+(C.estadoServicio==="Activo"?"ok":"mal")+'">'+esc(C.estadoServicio)+'</b></div></div>'+(C.wifi&&C.wifi.habilitado?'<div class="card" style="padding:16px;margin-top:14px"><b>Mi WiFi</b><p class="mut" style="margin:4px 0 12px">'+(C.wifi.ssid?'Red actual: <b>'+esc(C.wifi.ssid)+'</b>':'Cambia el nombre y la clave de tu red.')+'</p><a class="btn o full" href="#wifi">Cambiar nombre y clave</a></div>':""))},
 wifi:function(){var w=C.wifi||{};if(!w.habilitado)return pg("Mi WiFi",'<div class="card" style="padding:16px"><span class="mut">Esta opción no está disponible para tu servicio. Escríbenos por WhatsApp y te ayudamos.</span></div>');
  return pg("Mi WiFi",'<div class="card sp" style="padding:16px"><div><label class="mut" for="w-ssid">Nombre de la red</label><input id="w-ssid" class="inp" maxlength="32" autocomplete="off" value="'+esc(w.ssid||"")+'"></div><div><label class="mut" for="w-clave">Clave nueva (8 a 63 caracteres)</label><input id="w-clave" class="inp" type="password" maxlength="63" autocomplete="new-password"><label class="mut" style="display:flex;gap:8px;align-items:center;margin-top:6px;font-size:13px"><input type="checkbox" id="w-ver"> Mostrar clave</label></div><label style="display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--mut)"><input type="checkbox" id="w-ok" style="margin-top:3px"><span>Entiendo que mis dispositivos se desconectarán y tendré que volver a conectarlos con la clave nueva.</span></label><div class="err" id="w-err" style="color:var(--bad);font-weight:600;min-height:18px"></div><button class="btn full" id="w-go">Guardar cambios</button></div>')},
 velocidad:function(){return pg("Test de velocidad",'<p class="mut" style="margin-bottom:12px">Conéctate por WiFi cerca del router y cierra otras descargas para una medición más real.</p><a class="btn full" target="_blank" rel="noopener" href="'+CFG.speedtestUrl+'">Iniciar prueba</a>')},
 promos:function(){return pg("Promociones y noticias",C.promos.length?C.promos.map(function(p){return '<div class="card" style="padding:16px;margin-bottom:12px"><b>'+esc(p.t)+'</b>'+(p.f?'<div class="mut" style="font-size:12px">'+esc(p.f)+'</div>':"")+'<p class="mut" style="margin-top:6px;white-space:pre-line">'+esc(p.d)+'</p></div>'}).join(""):'<div class="card" style="padding:16px"><span class="mut">Aquí verás las promociones y noticias de tu proveedor.</span></div>')},
 cobertura:function(){return pg("Cobertura y zonas",'<p class="mut" style="margin-bottom:12px">¿Un familiar o amigo quiere el servicio? Consulta si hay cobertura en su dirección.</p>'+(CFG.municipio?'<iframe loading="lazy" title="Mapa" src="https://www.google.com/maps?q='+encodeURIComponent(CFG.municipio)+'&output=embed"></iframe>':"")+'<a class="btn wa full" style="margin-top:14px" target="_blank" rel="noopener" href="'+wa("Hola, quiero consultar cobertura en mi dirección.")+'">Consultar mi dirección</a>')}
};

function mapear(d){
  if(d.empresa){CFG.nombre=d.empresa.nombre||CFG.nombre;CFG.logoUrl=d.empresa.logoUrl||CFG.logoUrl;CFG.whatsapp=d.empresa.whatsapp||CFG.whatsapp}
  var nombre=String(d.cliente.nombre||"").trim(), prim=nombre.split(/\s+/)[0]||"";
  C={nombre:prim.charAt(0).toUpperCase()+prim.slice(1).toLowerCase(),nombreCompleto:nombre,documento:d.cliente.documento,direccion:d.cliente.direccion||"",
     contrato:d.contrato?String(d.contrato.numero):"",estadoServicio:d.contrato?d.contrato.estado:"Sin contrato",
     plan:d.plan?d.plan.nombre:"Sin plan",velocidad:d.plan?d.plan.bajada:0,subida:d.plan?d.plan.subida:0,saldo:Number(d.saldo)||0,
     facturas:(d.facturas||[]).map(function(f){return{p:periodo(f.emision),m:f.total,e:f.estado,v:fecha(f.vence),s:f.saldo}}),medios:(d.medios||[]).filter(function(m){return m.v}),promos:(d.avisos||[]).map(function(a){return{t:a.titulo,d:a.mensaje,f:fecha(a.fecha)}})};
}
function api(ruta,cuerpo){var o={headers:{"Content-Type":"application/json"}};if(cuerpo){o.method="POST";o.body=JSON.stringify(cuerpo)}else if(TOKEN){o.headers.Authorization="Bearer "+TOKEN}
  return fetch("/api/portal"+ruta,o).then(function(r){return r.json().catch(function(){return{}}).then(function(d){return{ok:r.ok,status:r.status,d:d}})})}
function salir(){TOKEN=null;C=null;try{localStorage.removeItem("portal_token")}catch(e){}}
function pantalla(h){document.getElementById("app").innerHTML=h;window.scrollTo(0,0)}
function login(paso,doc,err){
  pantalla(V.login(paso,doc,err));
  var b=document.getElementById(paso===2?"ver":"sol"),i=document.getElementById(paso===2?"cod":"doc");
  if(!b)return; i.focus();
  var enviar=function(){var v=i.value.trim();if(!v)return;b.disabled=true;b.textContent="Un momento…";
    if(paso===1){api("/solicitar-codigo",{documento:v}).then(function(){login(2,v,"")}).catch(function(){login(1,"","No hay conexión. Intenta de nuevo.")})}
    else{api("/verificar",{documento:doc,codigo:v}).then(function(r){if(!r.ok||!r.d.token){login(2,doc,"Código incorrecto o vencido.");return}
      TOKEN=r.d.token;try{localStorage.setItem("portal_token",TOKEN)}catch(e){};location.hash="#inicio";pintar()}).catch(function(){login(2,doc,"No hay conexión. Intenta de nuevo.")})}};
  b.addEventListener("click",enviar);i.addEventListener("keydown",function(e){if(e.key==="Enter")enviar()});
}
function pintar(){
  var r=(location.hash||"#inicio").slice(1);
  if(r==="salir"){salir();location.hash="#inicio";r="inicio"}
  if(DEMO_MODE){C=DEMO;if(r==="login"){login(1,"","");return}}
  else if(!TOKEN||r==="login"){C=null;login(1,"","");return}
  if(!C){pantalla('<div class="cargando">Cargando tu cuenta…</div>');
    api("/cuenta").then(function(x){if(x.status===401){salir();login(1,"","Tu sesión venció. Ingresa de nuevo.");return}
      if(!x.ok){pantalla('<div class="cargando">No pudimos cargar tu cuenta. Intenta de nuevo en un momento.</div>');return}
      mapear(x.d);aplicarMarca();api("/wifi").then(function(w){C.wifi=w.ok?w.d:{habilitado:false}}).catch(function(){C.wifi={habilitado:false}}).then(function(){pintar()})}).catch(function(){pantalla('<div class="cargando">Sin conexión. Revisa tu internet e intenta de nuevo.</div>')});return}
  pantalla((V[r]||V.inicio)());
  if(r==="wifi")bindWifi();
}
function bindWifi(){
  var go=document.getElementById("w-go");if(!go)return;
  var ssid=document.getElementById("w-ssid"),cl=document.getElementById("w-clave"),ok=document.getElementById("w-ok"),er=document.getElementById("w-err");
  document.getElementById("w-ver").addEventListener("change",function(e){cl.type=e.target.checked?"text":"password"});
  go.addEventListener("click",function(){
    var s=ssid.value.trim(),k=cl.value;er.textContent="";
    if(s.length<1||s.length>32||/[\u0000-\u001f\u007f]/.test(s)){er.textContent="El nombre de la red debe tener entre 1 y 32 caracteres.";return}
    if(k.length<8||k.length>63||/[^\x20-\x7e]/.test(k)){er.textContent="La clave debe tener entre 8 y 63 caracteres (letras, números y símbolos comunes, sin tildes ni ñ).";return}
    if(!ok.checked){er.textContent="Confirma que entiendes que tus dispositivos se desconectarán.";return}
    go.disabled=true;go.textContent="Guardando…";
    api("/wifi",{ssid:s,clave:k}).then(function(r){
      if(r.status===401){salir();login(1,"","Tu sesión venció. Ingresa de nuevo.");return}
      if(!r.ok){go.disabled=false;go.textContent="Guardar cambios";er.textContent=(r.d&&r.d.error)||"No pudimos cambiar tu WiFi. Intenta de nuevo.";return}
      C.wifi.ssid=s;
      pantalla(pg("Mi WiFi",'<div class="card" style="padding:18px"><b class="ok">¡Listo!</b><p class="mut" style="margin-top:6px">Cambiamos tu WiFi. En uno o dos minutos verás la red <b>'+esc(s)+'</b>: conecta tus dispositivos con la clave nueva.</p></div>'))
    }).catch(function(){go.disabled=false;go.textContent="Guardar cambios";er.textContent="Sin conexión. Intenta de nuevo."});
  });
}
function aplicarMarca(){document.documentElement.style.setProperty("--p",CFG.color);document.querySelector('meta[name=theme-color]').content=CFG.color;document.title=CFG.nombre}
/* Marca (logo y nombre) de la empresa del dominio: se muestra incluso antes de iniciar sesión */
fetch("/api/public/empresa",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&d.nombre){CFG.nombre=d.nombre;CFG.logoUrl=d.logoUrl||null;aplicarMarca();if(!C)pintar()}}).catch(function(){});
window.addEventListener("hashchange",pintar);aplicarMarca();pintar();
</script></body></html>
