services:
  olt-manager:
    build: .
    restart: unless-stopped
    env_file: .env
    # Red del host: así el panel alcanza los túneles inversos hacia las OLT (127.0.0.1:22xx).
    # Escucha solo en 127.0.0.1; Caddy (o el túnel de Cloudflare) publica el HTTPS.
    network_mode: host
    environment:
      DATA_DIR: /data
      HOST: 127.0.0.1
    volumes:
      - ./data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    network_mode: host
volumes:
  caddy_data:
